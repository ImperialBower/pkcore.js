name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: npm ci

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build addon
        run: npm run build

      - name: Test
        run: npm test

      - name: Type-check the generated definitions
        run: npm run typecheck

      # `napi build` regenerates index.js and index.d.ts. They are committed, so
      # a signature change that was not rebuilt shows up here as a dirty tree
      # rather than as wrong types shipped to npm.
      - name: Generated bindings are up to date
        run: |
          if ! git diff --exit-code -- index.js index.d.ts; then
            echo "::error::index.js / index.d.ts are stale. Run 'npm run build' and commit the result."
            exit 1
          fi
