name: Publish to npm

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - run: npm ci

      # `pkcore` pulls in rusqlite and zstd, which build C. Cross-compiling
      # aarch64 Linux from an x86_64 runner therefore needs a real cross
      # toolchain; `--use-napi-cross` supplies one. Native targets skip it.
      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: npm run build -- --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: npm run build -- --target ${{ matrix.target }} --use-napi-cross

      - name: Upload addon
        uses: actions/upload-artifact@v6
        with:
          name: bindings-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      # `napi pre-publish` creates a GitHub Release for the tag and attaches the
      # platform addons to it. That needs contents:write -- with contents:read
      # it fails with "Resource not accessible by integration" (403).
      contents: write
      id-token: write # npm provenance
    environment:
      name: npm
      url: https://www.npmjs.com/package/@imperialbower/pkcore
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Download every platform addon
        uses: actions/download-artifact@v7
        with:
          pattern: bindings-*
          merge-multiple: true
          path: artifacts

      # create-npm-dirs writes one package dir per target in `npm/`;
      # artifacts moves each downloaded .node into the dir that matches it;
      # pre-publish stamps the version and publishes the platform packages.
      - name: Assemble platform packages
        run: |
          npx napi create-npm-dirs
          npx napi artifacts --output-dir artifacts

      - name: Publish platform packages and the main package
        run: |
          npx napi pre-publish -t npm
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
