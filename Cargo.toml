[package]
name = "pkcore-js"
version = "0.9.1"
edition = "2021"
description = "Node.js bindings for pkcore, a high-performance poker analysis library"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ImperialBower/pkcore.js"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
pkcore = { version = "0.9.1", features = ["store"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
